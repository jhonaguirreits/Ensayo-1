<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wokwi Academy V7 | Flujo Unificado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<div id="screen-login" class="screen active">
  <div class="login-card">
    <i data-lucide="shield-check" class="logo-icon"></i>
    <h1>Wokwi Academy</h1>
    <button onclick="window.login()" class="btn-google">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G">
      Acceder con Google
    </button>
  </div>
</div>

<div id="screen-app" class="screen">
  <header>
    <div class="nav-brand"><i data-lucide="terminal"></i> Academy</div>
    
    <nav id="main-nav">
      <button onclick="window.switchView('view-student')" class="nav-btn active" id="nav-jugar">
        <i data-lucide="gamepad-2"></i> Jugar
      </button>
      
      <button onclick="window.switchView('view-teacher')" class="nav-btn" id="nav-teacher" style="display:none;">
        <i data-lucide="users"></i> Mis Grupos
      </button>
      
      <button onclick="window.switchView('view-admin')" class="nav-btn" id="nav-admin" style="display:none;">
        <i data-lucide="crown"></i> Modo Dios
      </button>
    </nav>

    <div class="user-pill">
      <span id="user-display-name">...</span>
      <button onclick="window.logout()" class="btn-icon-danger"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <main class="content-area">
    
    <section id="view-student" class="app-view active">
      <div class="game-container">
        <div class="card">
            <h2>Retos de Programación</h2>
            <p>Selecciona una semana y completa el desafío en Wokwi.</p>
            <div id="challenge-box" class="challenge-box">
                <h3>Cargando desafíos...</h3>
            </div>
        </div>
        <div class="card stats-sidebar">
            <h3>Mi Progreso</h3>
            <div class="stat-item">🪙 Monedas: <span id="val-monedas">0</span></div>
            <div class="stat-item">🔥 Racha: <span id="val-racha">0</span></div>
        </div>
      </div>
    </section>

    <section id="view-teacher" class="app-view">
        <div class="admin-header">
            <h2>Gestión de Grados y Asignaturas</h2>
            <button class="btn-accent" onclick="window.openNewGroupModal()">+ Nuevo Grupo</button>
        </div>
        <div id="teacher-groups-list" class="grid-layout">
            </div>
    </section>

    <section id="view-admin" class="app-view">
        <h2>Panel de Control Maestro</h2>
        <div class="card">
            <h3>Autorizar Nuevos Docentes</h3>
            <div class="input-row">
                <input type="email" id="input-new-teacher" placeholder="correo@itspereira.edu.co">
                <button onclick="window.addTeacher()">Habilitar Rol Docente</button>
            </div>
        </div>
        <table class="admin-table">
            <thead>
                <tr><th>Usuario</th><th>Email</th><th>Rol Actual</th><th>Acción</th></tr>
            </thead>
            <tbody id="admin-users-table"></tbody>
        </table>
    </section>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
